name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "waydlp website ${GITHUB_REF_NAME#v}" --generate-notes
